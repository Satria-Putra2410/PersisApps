name: SonarCloud analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  Analysis:
    runs-on: ubuntu-latest

    steps:
      # 🔴 WAJIB: ambil source code + git metadata
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # (Opsional, tapi disarankan jika pakai Node.js)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      # ✅ SonarCloud scan
      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Satria-Putra2410_PersisApps
            -Dsonar.organization=satria-putra2410
            -Dsonar.sources=.
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.scm.provider=git
